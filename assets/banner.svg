<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">Reps</title>
  <desc id="d">Reps, suivi de séances de sport. Workout tracker.</desc>
  <defs><clipPath id="card"><rect width="1280" height="360" rx="22"/></clipPath></defs>
  <g clip-path="url(#card)">
